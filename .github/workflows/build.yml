name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          pip install --upgrade buildozer cython==0.29.36
      - name: Accept licenses
        run: |
          mkdir -p ~/.android/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1059b8ea4b6ca\n" > ~/.android/licenses/android-sdk-license
          cp ~/.android/licenses/android-sdk-license ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
      - name: Build APK
        run: |
          buildozer android debug || true
          yes | find ~/.buildozer -name sdkmanager -type f -exec sh -c '{} --licenses' \; || true
          cp ~/.android/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osi-cheker-apk
          path: bin/*.apk
